<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>Jane Novell</title>
<link rel="stylesheet" href="chrys.css">
</head>

<body>

<nav aria-label="Navigation Bar">
<a class="small-text" href="#about">Event-Calendar</a>
<a class="small-text" href="#artwork">Gallery</a>
<a class="small-text" href="#contact">Bookings</a>
</nav>

<header id="top" class="big">
        <div class="bigtextcontainer">

<h1>Chrysalis</h1>

<img class="textbacking" src="chrysalis-front-placeholder.png" alt="" aria-hidden="true">

        </div>
</header>

<main class="centering">

<section id="about">

        <div class="aboutcontainer">

<h2>Event Calendar</h2>

            <div class="calendarframecontainer">

<div id="event-calendar"></div>

<img class="gunstoplayer" src="gunsaboutme.png"alt="" aria-hidden="true">

            </div>

        </div>

        <div class="bodyembcontainer">

<p class="body-text">
</p>

<p class="body-text">
</p>

<p class="body-text">
</p>

<img class="staremb"
src="starstextemb.png" alt="" aria-hidden="true">

        </div>

</section>

<section id="artwork">

        <div class="fireembcontainer">

<h2>Artwork Gallery</h2>    

<img class="fireemb" src="fireunderlay2.png" alt="" aria-hidden="true">

        </div>

        <div class="artwork">

<figure>
<img src="placeholder.png" alt="placeholder"></figure>

<figure>
<img src="placeholder.png" alt="placeholder">
</figure>

<figure>
<img src="placeholder.png" alt="placeholder">
</figure>

<figure>
<img src="placeholder.png" alt="placeholder">

</figure>

        </div>

</section>

</main>

<footer id="contact">

    <div class="contact-container">

        <h2>Bookings Contact</h2>

        <form
            class="contact-form"
            action="mailto:chrysalisdenver@gmail.com"
            method="post"
            enctype="text/plain"
        >

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="Name"
                placeholder="Your name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="Email"
                placeholder="your@email.com"
                required
            >


            <label for="message">
                Booking Information
            </label>

            <textarea
                id="message"
                name="Message"
                rows="8"
                placeholder=""
                required
            ></textarea>


            <button
                type="submit"
                class="contact-button"
            >
                Send
            </button>

        </form>

    </div>

</footer>

<script src="calendar.js"></script>

</body>
</html>
