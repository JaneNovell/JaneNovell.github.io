
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="final.css">
</head>
<body>
    <header class="header">
  <h1>Quicktype Player</h1>

<input type="file" id="songPicker" accept="audio/*">

</header>

<main>

  <section>
    <div class="volumeContainer">
      <div class="volumeBar" id="volumeBar"></div>
    </div>

    <p>Volume: <span id="volumeText">0%</span></p>
    <p><span id="levelText">1</span></p>
  </section>

  <section class="qtePanel">
    <div class="qteBox" id="qteDisplay">Press Start</div>
    <div class="timer" id="timer"></div>
    <input type="text" id="typeInput" placeholder="Type" autocomplete="off">
  </section>

  <section class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="resetBtn">Reset</button>

    <label>+<span id="gainText">1</span></label>
    <input type="range" id="volumeSlider" min="0" max="10" step="1" value="0">

  </section>
</main>

<footer class="footer"> 
</footer>

<audio id="audio" loop></audio>

<script src="final.js"></script>

</body>
</html>
