<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="final.css">
</head>
<body>
    <header class="header">
  <h1>Quicktype Player</h1>
</header>

<main>

  <section>
    <div class="volumeContainer">
      <div class="volumeBar" id="volumeBar"></div>
    </div>

    <p>Volume: <span id="volumeText">0%</span></p>
    <p>Level: <span id="levelText">1</span></p>
  </section>

  <section class="qtePanel">

    <div class="qteBox" id="qteDisplay">Press Start</div>
    <div class="timer" id="timer"></div>
  </section>

  <section class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
  </section>

</main>

<footer class="footer"> 
</footer>

<audio id="audio" loop>
  <source src="Mr Scruff- Kalimba (Ninja Tuna).mp3" type="audio/mpeg"> 
</audio>

<script src="final.js"></script>

</body>
</html>
