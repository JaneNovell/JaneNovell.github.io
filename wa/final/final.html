<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="final.css">
</head>
<body>
    <header class="header">
  <h1>Quick Time Event</h1>
  <p class="instructionText">
    Increase volume by completing key combos quickly
  </p>
</header>

<main class="game">

  <section class="status">
    <h2 class="hidden">Game Status</h2>

    <div class="volumeContainer">
      <div class="volumeBar" id="volumeBar"></div>
    </div>

    <p>Volume: <span id="volumeText">0%</span></p>
    <p>Level: <span id="levelText">1</span></p>
  </section>

  <section class="qtePanel">
    <h2>Quick Time Volume!</h2>

    <div class="qteBox" id="qteDisplay">Press Start</div>
    <div class="timer" id="timer"></div>
  </section>

  <section class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
  </section>

</main>

<footer class="footer"> 
</footer>

<audio id="audio" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"> 
</audio>

<script src="final.js" defer></script>

</body>
</html>
